name: Markdown E2E Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          playwright install --with-deps chromium

      - name: Run Markdown E2E Tests with Reports
        run: |
          md-e2e run tests/ --report-md summary.md --report-html report.html || true

      - name: Post PR Step Summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload HTML Execution Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-e2e-html-report
          path: report.html
